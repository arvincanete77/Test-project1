<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book Storage | BRBS</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head><body><header><a href="dashboard.html" class="brand">BRBS for DJC</a><button id="logoutBtn" class="secondary">Log Out</button></header><div class="layout"><nav><a href="dashboard.html">Dashboard</a><a class="active" href="Books.html">Book Storage</a><a href="Borrow.html">Borrow Books</a><a href="Return.html">Return Books</a></nav><main><p class="eyebrow">LIBRARY CATALOG</p><h1>Book Storage</h1><section class="panel"><h2 id="bookFormHeading">Add a Book</h2><p>Enter the ISBN, book name, and author.</p><form id="bookForm" class="grid"><input type="hidden" id="bookId"><label>ISBN<input id="bookISBN" placeholder="ISBN" required></label><label>Book name<input id="bookName" placeholder="Book title" required></label><label>Author<input id="bookAuthor" placeholder="Author name" required></label><div class="actions"><button id="bookSubmitBtn">Save Book</button><button id="cancelBookEdit" type="button" class="secondary hidden">Cancel Edit</button></div></form><p id="bookMessage" class="message"></p></section><section class="panel"><div class="between"><h2>Saved Books</h2><button id="exportBooksBtn" class="secondary">Export Books CSV</button></div><div class="between"><input id="bookSearch" placeholder="Search ISBN, title, or author"><span id="bookTotal"></span></div><div id="booksTableWrap" class="table-wrap"></div></section><p class="note">Books are stored in this browser's local storage, not a shared online database.</p></main></div></body></html>
